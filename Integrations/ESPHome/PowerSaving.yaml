globals:
  - id: last_soil_moisture_sent
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: minutes_since_report
    type: int
    restore_value: true
    initial_value: '0'
  - id: should_report
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: debug_prev_moisture
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: debug_moisture_changed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: debug_interval_elapsed
    type: bool
    restore_value: false
    initial_value: 'false'

number:
  - platform: template
    name: "Check Interval"
    id: wake_check_interval_min
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 1
    max_value: 720
    step: 1
    unit_of_measurement: min
    icon: "mdi:timer-outline"
    entity_category: CONFIG

  - platform: template
    name: "Soil Moisture Report Threshold"
    id: soil_moisture_delta
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 0.5
    max_value: 50
    step: 0.5
    unit_of_measurement: "%"
    icon: "mdi:water-percent"
    entity_category: CONFIG

text_sensor:
  - platform: template
    name: "Debug Power Saving"
    id: debug_power_saving
    update_interval: never
    entity_category: diagnostic
    lambda: |-
      char prev_str[16];
      if (std::isnan(id(debug_prev_moisture))) {
        snprintf(prev_str, sizeof(prev_str), "nan");
      } else {
        snprintf(prev_str, sizeof(prev_str), "%.1f", id(debug_prev_moisture));
      }
      char buf[80];
      snprintf(buf, sizeof(buf), "prev=%s changed=%d interval=%d now=%.1f",
               prev_str, id(debug_moisture_changed) ? 1 : 0, id(debug_interval_elapsed) ? 1 : 0,
               id(soil_moisture).state);
      return std::string(buf);
