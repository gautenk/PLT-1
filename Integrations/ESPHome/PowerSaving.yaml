globals:
  - id: last_soil_moisture_sent
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: last_battery_level_sent
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: minutes_since_report
    type: int
    restore_value: true
    initial_value: '0'
  - id: should_report
    type: bool
    restore_value: false
    initial_value: 'false'

number:
  - platform: template
    name: "Check Interval"
    id: wake_check_interval_min
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 1
    max_value: 720
    step: 1
    unit_of_measurement: min
    icon: "mdi:timer-outline"
    entity_category: CONFIG

  - platform: template
    name: "Soil Moisture Report Threshold"
    id: soil_moisture_delta
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 0
    max_value: 10
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:water-percent"
    entity_category: CONFIG

  - platform: template
    name: "Battery Level Report Threshold"
    id: battery_level_delta
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 15
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:battery-alert-variant"
    entity_category: CONFIG
