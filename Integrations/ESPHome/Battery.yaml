external_components:
  - source: github://ApolloAutomation/esphome-battery-component
    components: [max17048] #Forked OptionZero

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 15min   # kun brukt på aller første boot før noe annet har satt den
  run_duration: 90s

esphome:
  on_boot:
    - priority: 200   # rett ETTER wifi sin egen setup (250) - garanterer wifi-komponenten
      # er initialisert (men IKKE koblet til, siden enable_on_boot: false står i hovedfila)
      # før vi eventuelt kaller wifi.enable selv. Kjøres på alle boot, ikke bare wake-from-sleep.
      then:
        - lambda: |-
            // Rask sjekk FØR wifi kobles opp. soil_adc trenger en kort oppvarmingslesning
            // (kapasitiv sensor, RC-innsvingning etter at accessory_power slo på strøm).
            // max_17048 er en alltid-på fuel-gauge-brikke med kontinuerlig intern tilstand
            // og trenger ingen tilsvarende ventetid.
            // aht_20 (LATE prioritet) og soil_temperature (DS18B20, ~750ms konvertering)
            // holdes fortsatt utenfor - rapporteres som normalt når en tilkobling skjer.
            id(soil_adc).update();  // oppvarmingslesning - forkastes
            delay(100);
            id(soil_adc).update();  // faktisk lesning som brukes under
            id(soil_moisture).update();
            id(max_17048).update();

            id(minutes_since_report) += (int) id(wake_check_interval_min).state;

            // Terskel = 0 betyr "deaktivert" - IKKE "trigger på enhver endring". Må derfor
            // eksplisitt sjekkes FØR delta-sammenligningen.
            float moisture = id(soil_moisture).state;
            float last_moisture = id(last_soil_moisture_sent);
            float moisture_threshold = id(soil_moisture_delta).state;
            bool moisture_changed = (moisture_threshold > 0) &&
                (std::isnan(last_moisture) || fabs(moisture - last_moisture) > moisture_threshold);

            float battery = id(batt_pct).state;
            float last_battery = id(last_battery_level_sent);
            float battery_threshold = id(battery_level_delta).state;
            bool battery_changed = (battery_threshold > 0) &&
                (std::isnan(last_battery) || fabs(battery - last_battery) > battery_threshold);

            bool max_interval_elapsed = id(minutes_since_report) >= (id(deep_sleep_sleep_duration).state * 60.0f);

            // Hvis begge terskler er 0: eneste vei til en rapport er max_interval_elapsed.
            id(should_report) = moisture_changed || battery_changed || max_interval_elapsed;

            // Sett søvnlengden til sjekk-intervallet uansett utfall - dette er
            // hvor lenge den skal sove til NESTE sjekk, ikke til neste rapport.
            id(deep_sleep_1).set_sleep_duration((uint32_t)(id(wake_check_interval_min).state * 60000));

            if (id(should_report)) {
              id(last_soil_moisture_sent) = moisture;
              id(last_battery_level_sent) = battery;
              id(minutes_since_report) = 0;
            }
        - if:
            condition:
              and:
                - lambda: 'return !id(should_report);'
                - binary_sensor.is_off: ota_mode
                - switch.is_off: prevent_sleep
            then:
              - deep_sleep.enter:
                  id: deep_sleep_1
            else:
              - wifi.enable

sensor:
  - platform: max17048
    id: max_17048
    battery_voltage:
      name: Battery voltage
      id: batt_v
    battery_level:
      name: Battery level
      id: batt_pct
      filters:
        - lambda: |
            if (x > 100) return 100;
            else return (x);

switch:
  - platform: gpio
    pin: GPIO7
    name: "Accessory Power"
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 5000
    entity_category: CONFIG

number:
  - platform: template
    name: "Max Time Between Reports"
    id: deep_sleep_sleep_duration
    min_value: 0
    max_value: 800
    step: 0.01
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 12
    icon: "mdi:arrow-collapse-right"
    entity_category: CONFIG
    unit_of_measurement: "h"

script:
  - id: reportAllValues
    then:
      - component.update: soil_temperature
      - component.update: soil_moisture
      - component.update: aht_20
      - component.update: ltr_390
      - component.update: wifi_signal_db
      - component.update: sys_esp_temperature
      - component.update: sys_uptime
      - component.update: soil_adc
      - component.update: max_17048
